version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/otel"
      - "/xray"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"
    # otel and xray depend on the released root module; bump it with
    # `make bump-submodules` after a root release instead.
    ignore:
      - dependency-name: github.com/navigacontentlab/dindenault
      # v1.55+ requires Go 1.26. Remove when we move to Go 1.26.
      - dependency-name: github.com/aws/aws-lambda-go
        versions: [">= 1.55.0"]
      # otel v1.47+ / contrib v0.72+ require Go 1.26. Remove when we move to
      # Go 1.26 (planned for dindenault v1.9.0).
      - dependency-name: go.opentelemetry.io/otel*
        versions: [">= 1.47.0"]
      - dependency-name: go.opentelemetry.io/contrib/*
        versions: [">= 0.72.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
